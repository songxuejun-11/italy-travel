# 意大利出行小助手 - nginx 站点配置
# 部署位置：/etc/nginx/sites-available/italy-travel
# 纯 IP + HTTP 版本（后续加域名时可换 Caddy 或 certbot 升级 HTTPS）

server {
    listen 80 default_server;
    server_name _;

    # 前端静态文件（expo export 产物）
    root /opt/italy-travel/client-dist;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 Node 服务
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 附件上传上限（multer 单文件 20MB × 最多 10 个，留足余量）
        client_max_body_size 220m;
        # 上传可能较慢，放宽超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 附件文件反代到 Node（静态托管在 Express /files 路径）
    location /files/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
