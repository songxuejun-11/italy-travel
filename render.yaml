services:
  - type: web
    name: italy-travel-backend
    env: node
    plan: free
    buildCommand: cd server && pnpm install && pnpm build
    startCommand: cd server && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 9091
    healthCheckPath: /api/v1/health
